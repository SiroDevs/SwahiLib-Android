name: Build And Release

on:
  push:
    branches:
      - stable

permissions:
  contents: write

jobs:
  check-version:
    name: Check Version
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      tag: ${{ steps.version.outputs.tag }}
      versionCode: ${{ steps.version.outputs.versionCode }}
      apkName: ${{ steps.version.outputs.apkName }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive version + tag
        id: version
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts)
          TAG="v${VERSION_NAME}"
          echo "versionName=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "versionCode=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "apkName=SwahiLib-${TAG}.apk" >> "$GITHUB_OUTPUT"
          echo "Resolved tag: ${TAG} (versionCode ${VERSION_CODE})"

      - name: Check for existing tag
        id: check
        run: |
          if git ls-remote --tags origin | grep -q "refs/tags/${{ steps.version.outputs.tag }}$"; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "The release ${{ steps.version.outputs.tag }} already exists — nothing to release, skipping build."
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "Tag ${{ steps.version.outputs.tag }} is new — proceeding to build + release."
          fi

  build-release:
    name: Build Release
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create local.properties
        run: |
          echo "sdk.dir=${ANDROID_SDK_ROOT}" > local.properties
          echo "PAYSTACK_SECRET_KEY=${{ secrets.PAYSTACK_SECRET_KEY }}" >> local.properties
          echo "SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}" >> local.properties
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> local.properties
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> local.properties

      - name: Set up signing config
        run: |
          mkdir -p keystore
          echo "${{ secrets.SIGNING_KEY }}" | base64 -d > keystore/release.jks
          cat > keystore/key.properties <<EOF
          STORE_FILE=../keystore/release.jks
          KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS=${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Verify signing config
        run: |
          echo "keystore/key.properties keys present:"
          sed 's/=.*/=<set>/' keystore/key.properties
          for key in STORE_FILE KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            value=$(grep "^${key}=" keystore/key.properties | cut -d= -f2-)
            if [ -z "$value" ]; then
              echo "::error::${key} is empty — check that the matching secret is set."
              exit 1
            fi
          done
          if [ ! -f keystore/release.jks ] || [ ! -s keystore/release.jks ]; then
            echo "::error::keystore/release.jks is missing or empty — check secrets.SIGNING_KEY."
            exit 1
          fi
          echo "Signing config looks good."

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Build release AAB + APK
        run: ./gradlew bundleRelease assembleRelease --stacktrace

      - name: Locate build outputs
        id: outputs
        run: |
          AAB_PATH=$(find app/build/outputs/bundle/release -name "*.aab" | head -n 1)
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" ! -name "*unsigned*" | head -n 1)
          echo "aabPath=${AAB_PATH}" >> "$GITHUB_OUTPUT"
          echo "apkPath=${APK_PATH}" >> "$GITHUB_OUTPUT"

      - name: Rename APK to the release tag
        run: |
          mkdir -p release-assets
          cp "${{ steps.outputs.outputs.apkPath }}" "release-assets/${{ needs.check-version.outputs.apkName }}"

      - name: Upload AAB to Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: com.swahilib
          releaseFiles: ${{ steps.outputs.outputs.aabPath }}
          track: production
          status: completed

      - name: Create GitHub Release with tagged APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-version.outputs.tag }}
          name: ${{ needs.check-version.outputs.tag }}
          target_commitish: stable
          generate_release_notes: true
          files: release-assets/${{ needs.check-version.outputs.apkName }}

      - name: Clean up signing material
        if: always()
        run: rm -rf keystore local.properties
